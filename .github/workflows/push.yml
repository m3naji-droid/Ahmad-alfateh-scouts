name: Push notifications
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
concurrency:
  group: push
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        working-directory: push
        run: npm install --no-audit --no-fund --silent
      - name: Send
        working-directory: push
        env:
          VAPID_PUBLIC: BMlNr-3OgemimChY4PBskrO3FlKwW_eTcltQjAwQ4conRIh66-Lg6Gs4eJrn8x8iiywe01P2P11ae_CIyUjT_-Y
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
        run: node send.mjs
