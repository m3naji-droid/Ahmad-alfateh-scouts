<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>فرقة أحمد الفاتح</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Tajawal:wght@400;500;700&display=swap">
<style>
/* Layout: sticky top bar, one routed view below. Home = stitched green hero patch, then sections. Scout and admin pages are dashboards. */
:root {
  --bg: #e5e9db;
  --surface: #f3f6ea;
  --fg: #1c2a1b;
  --muted: #54624d;
  --line: #bac4a9;
  --primary: #24552f;
  --primary-fg: #f1f5e4;
  --panel: #24552f;
  --panel-fg: #eef3e0;
  --panel-muted: #b9cfa9;
  --accent: #c48a10;
  --gold: #f0c050;
  --danger: #a63a2a;
  --font-display: "Aref Ruqaa", "Traditional Arabic", serif;
  --font-body: "Tajawal", "Segoe UI", Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1910; --surface: #162418; --fg: #e2ebd7; --muted: #9db08f; --line: #2b4130;
    --primary: #8fc98a; --primary-fg: #0e1910; --panel: #1b3a24; --panel-fg: #eaf1dc; --panel-muted: #a9c49b;
    --accent: #e3a92a; --gold: #f0c050; --danger: #e0715f;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1910; --surface: #162418; --fg: #e2ebd7; --muted: #9db08f; --line: #2b4130;
  --primary: #8fc98a; --primary-fg: #0e1910; --panel: #1b3a24; --panel-fg: #eaf1dc; --panel-muted: #a9c49b;
  --accent: #e3a92a; --gold: #f0c050; --danger: #e0715f;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 1rem; line-height: 1.8;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 20; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: 700; line-height: 1.35; margin: 0; text-wrap: balance; }
p { margin: 0; }
.wrap { max-width: 1080px; margin-inline: auto; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 21; background: var(--bg); border-bottom: 2px dashed var(--line); }
.bar .wrap { display: flex; align-items: center; gap: 18px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; font-family: var(--font-display); font-weight: 700; font-size: 1.3rem; white-space: nowrap; }
.brand svg { width: 38px; height: 38px; }
.nav { display: flex; gap: 4px; margin-inline-start: auto; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav a, .nav button { white-space: nowrap; padding: 6px 14px; border-radius: 99px; text-decoration: none; font-size: .95rem; color: var(--muted); background: none; border: 0; font-family: inherit; cursor: pointer; }
.nav a:hover, .nav button:hover { color: var(--fg); }
.nav .go { background: var(--primary); color: var(--primary-fg); font-weight: 700; }
.chip { font-size: .75rem; padding: 1px 12px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }

/* buttons + forms */
.btn { display: inline-block; font-family: inherit; font-size: 1rem; font-weight: 700; padding: 10px 24px; border-radius: 6px; border: 2px solid var(--primary); background: var(--primary); color: var(--primary-fg); text-decoration: none; cursor: pointer; }
.btn.ghost { background: none; color: var(--fg); border-color: var(--fg); }
.btn.gold { background: var(--gold); border-color: var(--gold); color: #2a1d00; }
.btn.ghost-l { background: none; color: var(--panel-fg); border-color: var(--panel-fg); }
.btn.sm { padding: 3px 14px; font-size: .875rem; }
.btn.danger { background: none; border-color: var(--danger); color: var(--danger); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: .875rem; font-weight: 500; color: var(--muted); }
input[type=text], input[type=password], input[type=number], input[type=tel], select, textarea {
  font-family: inherit; font-size: 1rem; padding: 9px 12px; border: 1.5px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100%; min-width: 0;
}
textarea { min-height: 90px; resize: vertical; }
.form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.form-grid .full { grid-column: 1 / -1; }
.flash { background: var(--primary); color: var(--primary-fg); padding: 10px 16px; border-radius: 6px; font-weight: 500; margin-bottom: 14px; }
.err { color: var(--danger); font-size: .9rem; min-height: 1.4em; }

/* hero */
.herobn { margin-top: 24px; border-radius: 10px; overflow: hidden; background: var(--panel); }
.herobn img { display: block; width: 100%; max-height: 380px; object-fit: cover; }
.hero { margin-top: 24px; background: var(--panel); color: var(--panel-fg); border-radius: 10px; padding: 14px; }
.hero-in { border: 2px dashed var(--panel-muted); border-radius: 6px; padding: 40px 36px; display: grid; grid-template-columns: 1.3fr 1fr; gap: 36px; align-items: center; }
.hero h1 { font-size: clamp(2.3rem, 7vw, 4.2rem); }
.hero .motto { font-family: var(--font-display); color: var(--gold); font-size: 1.5rem; margin-bottom: 8px; }
.hero p.lead { margin-top: 16px; color: var(--panel-muted); font-size: 1.15rem; max-width: 32em; }
.hero .cta { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 26px; }
.hero .facts { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-top: 26px; color: var(--panel-muted); font-size: .9rem; }
.hero .facts b { color: var(--panel-fg); font-size: 1.3rem; font-variant-numeric: tabular-nums; margin-inline-end: 4px; }
.hero svg.emb { width: 100%; max-width: 96px; margin: 0 0 14px; display: block; height: auto; }

/* sections */
section.sec { padding-top: 36px; scroll-margin-top: 64px; }
.sec-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 24px; margin-bottom: 26px; }
.sec-h h2 { font-size: 2rem; }
.sec-h p { color: var(--muted); max-width: 28em; }
.cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 40px; }
.cols > * { min-width: 0; }
.values { display: grid; gap: 14px; }
.value { display: grid; grid-template-columns: 44px 1fr; gap: 14px; align-items: start; }
.value .ic { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--primary); display: grid; place-items: center; color: var(--primary); }
.value h4 { font-size: 1.2rem; }
.value p { color: var(--muted); font-size: .95rem; }
.tl { list-style: none; margin: 0; padding: 0; border-inline-start: 3px solid var(--line); display: grid; gap: 18px; padding-inline-start: 22px; }
.tl li { position: relative; }
.tl li::before { content: ""; position: absolute; inset-inline-start: -30px; top: 8px; width: 13px; height: 13px; border-radius: 50%; background: var(--accent); border: 3px solid var(--bg); }
.tl .when { font-size: .8rem; color: var(--accent); font-weight: 700; }
.tl h4 { font-size: 1.15rem; }
.tl p { color: var(--muted); font-size: .92rem; }
.note { font-size: .8rem; color: var(--muted); border: 1px dashed var(--line); padding: 4px 12px; border-radius: 6px; display: inline-block; margin-top: 14px; }

.acts { display: grid; gap: 0; border-top: 2px solid var(--fg); }
.act { display: grid; grid-template-columns: 86px 1fr auto; gap: 8px 20px; align-items: center; padding-block: 16px; border-bottom: 1px solid var(--line); }
.act.past { opacity: .55; }
.date { text-align: center; border: 2px solid var(--primary); border-radius: 8px; padding: 4px 0; line-height: 1.2; }
.date b { display: block; font-size: 1.7rem; font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.date span { font-size: .8rem; color: var(--muted); }
.act h3 { font-size: 1.25rem; }
.act .meta { color: var(--muted); font-size: .9rem; }
.kind { font-size: .78rem; padding: 1px 12px; border-radius: 99px; background: var(--primary); color: var(--primary-fg); white-space: nowrap; }

.gal { display: grid; grid-template-columns: repeat(6, 1fr); grid-auto-rows: 90px; gap: 12px; }
.ph { border: 2px dashed var(--line); border-radius: 8px; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: .85rem; text-align: center; padding: 8px; background: var(--surface); }
.ph svg { width: 30px; height: 30px; }
.ph:nth-child(1) { grid-column: span 3; grid-row: span 3; }
.ph:nth-child(2) { grid-column: span 3; grid-row: span 2; }
.ph:nth-child(3) { grid-column: span 3; grid-row: span 1; }
.ph:nth-child(4) { grid-column: span 2; grid-row: span 2; }
.ph:nth-child(5) { grid-column: span 2; grid-row: span 2; }
.ph:nth-child(6) { grid-column: span 2; grid-row: span 2; }

.join { background: var(--surface); border: 2px dashed var(--line); border-radius: 10px; padding: 28px; }

footer.ft { margin-top: 80px; border-top: 2px dashed var(--line); padding-block: 28px 44px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 14px; color: var(--muted); font-size: .9rem; }

/* login */
.login h1 { color: var(--fg); font-size: 1.8rem; }
.login { max-width: 460px; margin: 48px auto 0; background: var(--surface); border: 2px dashed var(--line); border-radius: 10px; padding: 28px; display: grid; gap: 16px; }
\1\n.hero .login { margin: 0; max-width: none; color: var(--fg); }
.seg { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--primary); border-radius: 8px; overflow: hidden; }
.seg button { font-family: inherit; font-size: .92rem; white-space: nowrap; font-weight: 700; padding: 8px 2px; border: 0; background: none; color: var(--primary); cursor: pointer; }
.seg button.on { background: var(--primary); color: var(--primary-fg); }
.hint { font-size: .85rem; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 8px 12px; }

/* dashboards */
.dash-h { padding-top: 36px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 10px; margin-bottom: 22px; }
.dash-h h1 { font-size: 2.2rem; }
.grid2 { display: grid; grid-template-columns: 330px 1fr; gap: 24px; align-items: start; }
.grid2 > * { min-width: 0; }
.card { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 20px; min-width: 0; }
.card + .card { margin-top: 20px; }
.card h3 { font-size: 1.35rem; margin-bottom: 12px; }
.avatar { width: 128px; height: 128px; border-radius: 50%; border: 3px solid var(--primary); background: var(--bg); display: grid; place-items: center; overflow: hidden; margin: 0 auto 14px; color: var(--muted); }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.avatar svg { width: 56px; height: 56px; }
.up { display: flex; justify-content: center; margin-bottom: 16px; }
.up label.btn { cursor: pointer; }
.up input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
.stack { display: grid; gap: 12px; }
.badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.badge { text-align: center; display: grid; gap: 6px; justify-items: center; font-size: .9rem; }
.ring { --p: 0%; width: 76px; height: 76px; border-radius: 50%; background: conic-gradient(var(--accent) var(--p), var(--line) 0); display: grid; place-items: center; }
.ring i { width: 62px; height: 62px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--muted); }
.ring.done { background: var(--primary); }
.ring.done i { background: var(--primary); color: var(--primary-fg); }
.ring svg { width: 28px; height: 28px; }
.badge small { color: var(--muted); font-variant-numeric: tabular-nums; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.tasks label { display: flex; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.tasks input { width: 20px; height: 20px; accent-color: var(--primary); flex: none; }
.tasks .done span { text-decoration: line-through; color: var(--muted); }
.prog { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; margin-bottom: 12px; }
.prog i { display: block; height: 100%; background: var(--accent); }
.ann { padding-block: 10px; border-bottom: 1px dashed var(--line); }
.ann:last-child { border-bottom: 0; }
.ann h4 { font-size: 1.1rem; }
.ann small { color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat { background: var(--surface); border: 1.5px solid var(--line); border-radius: 10px; padding: 14px 18px; }
.stat b { display: block; font-family: var(--font-display); font-size: 2.2rem; line-height: 1.2; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: .9rem; }
.tabs { display: flex; gap: 6px; overflow-x: auto; border-bottom: 2px solid var(--line); margin-bottom: 20px; }
.tabs button { font-family: inherit; font-size: 1rem; font-weight: 500; padding: 8px 18px; border: 0; background: none; color: var(--muted); border-bottom: 3px solid transparent; margin-bottom: -2px; cursor: pointer; white-space: nowrap; }
.tabs button.on { color: var(--fg); border-bottom-color: var(--accent); font-weight: 700; }
.tbl { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: .95rem; }
th { text-align: start; font-size: .8rem; color: var(--muted); font-weight: 500; padding: 6px 10px; border-bottom: 2px solid var(--fg); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num { font-variant-numeric: tabular-nums; }
.row-act { display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.bars { display: grid; gap: 10px; }
.bars .b { display: grid; grid-template-columns: 90px 1fr 44px; gap: 10px; align-items: center; font-size: .9rem; }
.bars .t { height: 12px; background: var(--line); border-radius: 6px; overflow: hidden; }
.bars .t i { display: block; height: 100%; background: var(--primary); border-radius: 6px; }
.bars .v { font-variant-numeric: tabular-nums; color: var(--muted); }
.msg { padding: 12px 0; border-bottom: 1px dashed var(--line); display: grid; gap: 6px; }
.msg.unread strong::after { content: ""; display: inline-block; width: 9px; height: 9px; background: var(--accent); border-radius: 50%; margin-inline-start: 8px; }
.empty { color: var(--muted); padding: 18px 0; }
.xl { width: auto; min-width: 100%; }
.xl th, .xl td { border: 1px solid var(--line); padding: 6px 12px; white-space: nowrap; }
.xl .col { background: var(--bg); color: var(--muted); text-align: center; font-size: .75rem; font-weight: 400; border-bottom: 1px solid var(--line); }
.xl .hd td { background: var(--primary); color: var(--primary-fg); font-weight: 700; }
.xl .rn { background: var(--bg); color: var(--muted); text-align: center; font-size: .75rem; width: 34px; }
.st { font-size: .78rem; padding: 1px 12px; border-radius: 99px; border: 1px solid var(--primary); color: var(--primary); white-space: nowrap; }
.st.bad { border-color: var(--danger); color: var(--danger); }
.xl-box { display: grid; gap: 16px; grid-template-columns: 1fr 1fr; }
.xl-box > * { min-width: 0; }
.drop { border: 2px dashed var(--line); border-radius: 8px; padding: 16px; display: grid; gap: 10px; align-content: start; }
.drop input[type=file] { position: absolute; width: 1px; height: 1px; opacity: 0; }
@media (max-width: 820px) { .xl-box { grid-template-columns: 1fr; } }

@media (max-width: 820px) {
  .hero-in { grid-template-columns: 1fr; padding: 28px 20px; }
  .cols, .grid2 { grid-template-columns: 1fr; }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .form-grid { grid-template-columns: 1fr; }
  .act { grid-template-columns: 70px 1fr; }
  .act .kind { grid-column: 2; justify-self: start; }
  .gal { grid-template-columns: repeat(2, 1fr); grid-auto-rows: 110px; }
  .ph:nth-child(n) { grid-column: span 1; grid-row: span 1; }
  .ph:nth-child(1) { grid-column: span 2; grid-row: span 2; }
  .badges { grid-template-columns: repeat(2, 1fr); }
  section.sec { padding-top: 24px; }
  .brand span { display: none; }
}

/* gallery */
.albums { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 22px; }
.alb { display: block; position: relative; text-decoration: none; color: inherit; border: 2px dashed var(--line); border-radius: 10px; padding: 10px; background: var(--surface); }
.alb:hover { border-color: var(--primary); }
.alb h3 { font-size: 1.3rem; margin-top: 10px; }
.alb .m { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: .9rem; }
.alb .tag { position: absolute; top: 18px; inset-inline-end: 18px; font-size: .75rem; background: var(--bg); border: 1px solid var(--line); border-radius: 99px; padding: 0 10px; color: var(--muted); }
.mos { display: grid; gap: 3px; aspect-ratio: 4 / 3; border-radius: 6px; overflow: hidden; background: var(--line); grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; }
.mos img { width: 100%; height: 100%; object-fit: cover; display: block; min-width: 0; min-height: 0; }
.mos img:first-child { grid-row: span 2; }
.mos.n1 { grid-template-columns: 1fr; grid-template-rows: 1fr; }
.mos.n1 img:first-child { grid-row: auto; }
.mos.n2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr; }
.mos.n2 img:first-child { grid-row: auto; }
.mos.n0 { place-items: center; color: var(--muted); grid-template-columns: 1fr; grid-template-rows: 1fr; }
button.alb.new { display: grid; place-items: center; align-content: center; gap: 4px; min-height: 220px; width: 100%; cursor: pointer; font-family: inherit; color: var(--primary); font-size: 1.15rem; background: none; }
button.alb.new span { font-size: 3rem; line-height: 1; }
.back { display: inline-block; margin-bottom: 14px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--fg); }
.masonry { columns: 3 240px; column-gap: 14px; }
.masonry button { display: block; width: 100%; margin: 0 0 14px; padding: 0; border: 0; background: var(--line); border-radius: 6px; overflow: hidden; cursor: zoom-in; break-inside: avoid; }
.masonry img { width: 100%; height: auto; display: block; }
.act .meta a { color: var(--primary); font-weight: 700; }
.dz { border: 2px dashed var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 10px; justify-items: center; text-align: center; margin-top: 16px; }
.dz.over { border-color: var(--primary); background: var(--bg); }
.evin, .addinp { position: absolute; width: 1px; height: 1px; opacity: 0; }
.dr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.dr { position: relative; aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--line); }
.dr img { width: 100%; height: 100%; object-fit: cover; display: block; }
.dr button { position: absolute; top: 4px; inset-inline-end: 4px; width: 24px; height: 24px; border-radius: 50%; border: 0; background: rgba(10, 20, 12, .75); color: #fff; cursor: pointer; font-size: 1rem; line-height: 1; padding: 0; }
.am-h { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
.strip { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; }
.th { position: relative; flex: none; width: 84px; height: 84px; border-radius: 6px; overflow: hidden; background: var(--line); }
.th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.th .x { position: absolute; top: 3px; inset-inline-end: 3px; min-width: 24px; height: 24px; border-radius: 12px; border: 0; background: rgba(10, 20, 12, .75); color: #fff; cursor: pointer; font-family: inherit; font-size: .85rem; padding: 0 6px; }
.th .x.on { background: var(--danger); }
#lb { position: fixed; inset: 0; z-index: 50; background: rgba(6, 12, 8, .95); display: grid; place-items: center; padding: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(56px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
#lb img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
.lb-x, .lb-b { position: absolute; width: 44px; height: 44px; border-radius: 50%; border: 0; background: rgba(255, 255, 255, .14); color: #fff; font-size: 1.8rem; line-height: 1; cursor: pointer; padding: 0; font-family: inherit; }
.lb-x { top: calc(10px + env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.lb-b { top: 50%; transform: translateY(-50%); }
.lb-p { right: max(8px, env(safe-area-inset-right, 0px)); }
.lb-n { left: max(8px, env(safe-area-inset-left, 0px)); }
.lb-c { position: absolute; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); left: 0; right: 0; text-align: center; color: #e8efe0; font-size: .9rem; }
@media (max-width: 820px) { .masonry { columns: 2 140px; } .lb-b { top: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); transform: none; } }

  /* ---------- behavior & points ---------- */
  var GOODB = ["المشاركة الفاعلة في الحصة", "الالتزام", "الاحترام", "أداء الواجبات", "مساعدة الزملاء", "التعاون مع الفريق", "النظافة والترتيب", "المبادرة في الخدمة"];

  var ACTIONS = [["w2", "إيقاف أسبوعين", 14], ["m1", "إيقاف شهر", 30], ["m2", "إيقاف شهرين", 60], ["t1", "إيقاف فصل كامل", 120], ["t2", "إيقاف فصلين كاملين", 240], ["out", "الفصل النهائي من الفرقة", 0]];
  var LEVELS = [[0, "كشاف مبتدئ"], [20, "كشاف نشيط"], [50, "كشاف متميز"], [100, "نجم الفرقة"], [200, "قائد الأبطال"]];
  function isoOf(d) { var z = function (x) { return (x < 10 ? "0" : "") + x; }; return d.getFullYear() + "-" + z(d.getMonth() + 1) + "-" + z(d.getDate()); }
  function addDays(iso, n) { var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() + n); return isoOf(d); }
  function weekStart(iso) { var d = new Date(iso + "T12:00:00"); d.setDate(d.getDate() - d.getDay()); return isoOf(d); }

  function weekOf(id, off) { var ws = addDays(weekStart(TODAY), -7 * off), we = addDays(ws, 6); return sumPts(recsOf(id).filter(function (r) { return r.date >= ws && r.date <= we; })); }

  }
  function rankList(off) {

      .sort(function (a, b) { return b.w - a.w || b.t - a.t || (a.m.name < b.m.name ? -1 : 1); });

      if (!beh) { ui.flash = { where: "teach", text: good ? "اختر السلوك الحسن أو اكتبه." : "اختر المخالفة أو اكتبها.", err: true }; refresh(); return; }
      var sc2 = byId(S.members, tf.scout), rid = nid();
      S.records.push({ id: rid, scoutId: tf.scout, teacherId: uid, teacherName: tch ? tch.name : "", kind: tf.kind, beh: beh, points: (good ? 1 : -1) * tf.pts, note: String(tf.note || "").trim(), date: TODAY, ts: Date.now(), seen: false });
      var sent = !good && tf.action;
      if (sent) S.cases.push({ id: nid(), recId: rid, scoutId: tf.scout, behavior: beh, points: -tf.pts, teacherId: uid, teacherName: tch ? tch.name : "", action: tf.action, status: "pending", date: TODAY, adminNote: "", decided: "", decidedDate: "" });
      save();
      ui.flash = { where: "teach", text: "سُجّل " + sgn(good ? tf.pts : -tf.pts) + " نقطة للكشاف " + (sc2 ? sc2.name : "") + (sent ? ". أُرسل الإجراء «" + tf.action + "» إلى الإدارة للاعتماد." : ".") };
      ui.tf = { scout: 0, kind: tf.kind, beh: "", other: "", pts: 5, action: "", note: "" }; refresh();
    } else if (f === "addTeacher") {
      var c3 = newCred(v("t-user"), v("t-pass"), "teacher");
      if (c3.err) { ui.flash = { where: "teachers", text: c3.err, err: true }; refresh(); return; }
      S.teachers.push({ id: nid(), name: v("t-name"), title: v("t-title") || "معلم", user: c3.user, pass: c3.pass });
      logEv("إضافة المعلم " + v("t-name")); save(); ui.flash = { where: "teachers", text: "تمت إضافة " + v("t-name") + ". اسم المستخدم: " + c3.user + " · كلمة المرور: " + c3.pass }; refresh();
    } else if (f === "addStaff") {
      var c2 = newCred(v("st-user"), v("st-pass"), "staff");
      if (c2.err) { ui.flash = { where: "staff", text: c2.err, err: true }; refresh(); return; }
      S.staff.push({ id: nid(), name: v("st-name"), title: v("st-title") || "عضو إدارة", user: c2.user, pass: c2.pass });
      save(); ui.flash = { where: "staff", text: "تمت إضافة " + v("st-name") + ". اسم المستخدم: " + c2.user + " · كلمة المرور: " + c2.pass }; refresh();
    } else if (f === "addActivity") {
      var sd = v("aa-date") || TODAY, ed2 = v("aa-end");
      if (ed2 && ed2 < sd) { var sw = sd; sd = ed2; ed2 = sw; }
      S.activities.push({ id: nid(), title: v("aa-title"), date: sd, end: ed2 && ed2 !== sd ? ed2 : "", place: v("aa-place"), kind: v("aa-kind") });
      ui.newAct = false; save(); ui.flash = { where: "act", text: "نُشر النشاط على الخط الزمني." }; refresh();
    } else if (f === "addEvent") {
      var en = v("ev-name"), ed = v("ev-date") || TODAY, edesc = v("ev-desc");
      if (!en) return;
      var ex = S.albums.filter(function (x) { return norm(x.title) === norm(en); })[0], al2 = ex;
      if (!al2) { al2 = { id: nid(), title: en, date: ed, desc: edesc }; S.albums.push(al2); }
      var items = draft.slice();
      addPhotos(al2.id, items).then(function (fails) {
        draft = []; ui.newEv = false; save();
        ui.flash = { where: "photos", text: (ex ? "أضيفت " + items.length + " صورة إلى «" + al2.title + "»." : "نُشرت فعالية «" + al2.title + "» مع " + items.length + " صورة.") + (fails ? " تعذر حفظ بعضها بشكل دائم." : "") };
        refresh();
      });
    } else if (f === "editAlb") {
      var ea = albumById(ui.editAlb);
      if (ea) { ea.title = v("ea-title"); ea.date = v("ea-date") || ea.date; ea.desc = v("ea-desc"); save(); }
      ui.editAlb = null; ui.flash = { where: "photos", text: "تم حفظ بيانات الفعالية." }; refresh();
    }
  });

  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "tf-other") ui.tf.other = t.value;
    if (t.id === "pt-other" && ui.pt) ui.pt.other = t.value;
    if (t.id === "tf-note") ui.tf.note = t.value;
    if (t.id !== "ev-name") return;
    var n = norm(t.value), hint = document.getElementById("ev-hint"), d = document.getElementById("ev-date");
    var al = S.albums.filter(function (x) { return norm(x.title) === n; })[0], ac = S.activities.filter(function (x) { return norm(x.title) === n; })[0];
    if (hint) hint.textContent = al ? "هذه الفعالية موجودة، وستُضاف الصور إلى ألبومها." : ac ? "مطابقة لنشاط في الجدول، وتم أخذ تاريخه." : "";
    if (ac && !al && d) d.value = ac.date;
  });
  ["dragover", "dragleave", "drop"].forEach(function (ev) {
    document.addEventListener(ev, function (e) {
      var z = e.target.closest && e.target.closest("#dz");
      if (!z) return;
      e.preventDefault();
      if (ev === "dragover") z.classList.add("over");
      else { z.classList.remove("over"); if (ev === "drop" && e.dataTransfer) draftFiles(Array.prototype.slice.call(e.dataTransfer.files)); }
    });
  });
  document.addEventListener("keydown", function (e) {
    if (!ui.lb) return;
    if (e.key === "Escape") lbClose(); else if (e.key === "ArrowLeft") lbStep(1); else if (e.key === "ArrowRight") lbStep(-1);
  });
  var tx0 = null;
  document.addEventListener("touchstart", function (e) { tx0 = ui.lb && e.touches[0] ? e.touches[0].clientX : null; }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (tx0 === null || !ui.lb || !e.changedTouches[0]) return;
    var dx = e.changedTouches[0].clientX - tx0; tx0 = null;
    if (Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1);
  }, { passive: true });

  /* ---------- المزامنة المباشرة (Firebase Realtime Database عبر REST + SSE) ---------- */
  var cl = { last: {}, remote: {}, timer: null, busy: false, first: true, ph: {}, es: null, st: "off" };
  function clBase() { return CLOUD.replace(/\/+$/, ""); }
  function clJ(url, opt) { return fetch(url, opt).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function clStatus(st) {
    cl.st = st;
    if (!CLOUD) return;
    var el = document.getElementById("clpill");
    if (!el) { el = document.createElement("div"); el.id = "clpill"; el.style.cssText = "position:fixed;bottom:6px;left:8px;z-index:50;font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(0,0,0,.55);color:#fff;pointer-events:none"; document.body.appendChild(el); }
    el.textContent = st === "on" ? "● مباشر" : st === "sync" ? "◐ مزامنة…" : "○ غير متصل";
    el.style.background = st === "on" ? "rgba(21,128,61,.85)" : st === "sync" ? "rgba(180,120,0,.85)" : "rgba(185,28,28,.85)";
  }
  function cloudPush() {
    if (!CLOUD || cl.first) return;
    clearTimeout(cl.timer);
    cl.timer = setTimeout(function () { cl.timer = null; clFlush(); }, 350);
  }
  function clFlush() {
    if (cl.busy) { cloudPush(); return; }
    var jobs = [];
    Object.keys(S).forEach(function (k) {
      if (k === "meId") return;
      var v = JSON.stringify(S[k]);
      if (v !== cl.last[k]) jobs.push(clJ(clBase() + "/afs/" + k + ".json", { method: "PUT", body: JSON.stringify(v) }).then(function () { cl.last[k] = v; }));
    });
    if (!jobs.length) return;
    cl.busy = true; clStatus("sync");
    Promise.all(jobs).then(function () { clStatus("on"); }).catch(function () { clStatus("off"); setTimeout(cloudPush, 5000); })
      .then(function () { cl.busy = false; clApply(); });
  }
  function clRefresh() {
    var ae = document.activeElement;
    if (ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) { setTimeout(clRefresh, 2500); return; }
    if (ui.lb || (shown === "admin-photos" && ui.newEv)) return;
    var y = window.scrollY; refresh(); window.scrollTo(0, y);
  }
  function clApply() {
    if (cl.busy || cl.timer) return;
    var changed = false;
    Object.keys(cl.remote).forEach(function (k) {
      var r = cl.remote[k];
      if (typeof r !== "string" || k === "meId") return;
      var loc = JSON.stringify(S[k]);
      if (r === loc) { cl.last[k] = r; return; }
      if (!cl.first && loc !== cl.last[k]) return; /* تعديل محلي لم يُرسل بعد */
      try { S[k] = JSON.parse(r); cl.last[k] = r; changed = true; } catch (e) {}
    });
    if (cl.first) { cl.first = false; clFlush(); }
    if (changed) { clRefresh(); }
  }
  function clConnect() {
    if (!CLOUD || !window.EventSource) return;
    clStatus("sync");
    var es = cl.es = new EventSource(clBase() + "/afs.json");
    es.addEventListener("put", function (e) {
      var d; try { d = JSON.parse(e.data); } catch (x) { return; }
      if (d.path === "/") cl.remote = d.data || {};
      else { var k = d.path.split("/")[1]; if (d.data === null) delete cl.remote[k]; else cl.remote[k] = d.data; }
      clStatus("on"); clApply();
    });
    es.addEventListener("patch", function (e) {
      var d; try { d = JSON.parse(e.data); } catch (x) { return; }
      Object.keys(d.data || {}).forEach(function (k) { if (d.data[k] === null) delete cl.remote[k]; else cl.remote[k] = d.data[k]; });
      clApply();
    });
    es.onerror = function () { clStatus("off"); };
    es.onopen = function () { clStatus("on"); };
    clPhotoSync(); setInterval(clPhotoSync, 6000);
  }
  function cloudRestore(obj) {
    if (!CLOUD) { location.reload(); return; }
    Promise.all(Object.keys(obj).map(function (k) { return clJ(clBase() + "/afs/" + k + ".json", { method: "PUT", body: JSON.stringify(JSON.stringify(obj[k])) }); }))
      .then(function () { location.reload(); }).catch(function () { location.reload(); });
  }
  /* الصور: كل صورة عقدة مستقلة في /photos */
  function clPhotoPut(p) {
    if (!CLOUD || cl.ph[p.id]) return;
    cl.ph[p.id] = 1;
    clJ(clBase() + "/photos/" + p.id + ".json", { method: "PUT", body: JSON.stringify(p) }).catch(function () { delete cl.ph[p.id]; });
  }
  function clPhotoDel(id) {
    if (!CLOUD) return;
    delete cl.ph[id];
    fetch(clBase() + "/photos/" + id + ".json", { method: "DELETE" }).catch(function () {});
  }
  var phBusy = false;
  function clPhotoSync() {
    if (phBusy || !CLOUD || idbOk === null) return;
    phBusy = true;
    clJ(clBase() + "/photos.json?shallow=true").then(function (idx) {
      idx = idx || {};
      var changed = false, jobs = [];
      PH = PH.filter(function (p) { if (cl.ph[p.id] && !idx[p.id]) { delete cl.ph[p.id]; dbTx("readwrite", function (st) { return st.delete(p.id); }).catch(function () {}); changed = true; return false; } return true; });
      PH.forEach(function (p) { if (!idx[p.id] && !cl.ph[p.id]) clPhotoPut(p); else cl.ph[p.id] = 1; });
      Object.keys(idx).forEach(function (id) {
        if (PH.some(function (p) { return String(p.id) === id; })) return;
        jobs.push(clJ(clBase() + "/photos/" + id + ".json").then(function (rec) {
          if (!rec) return;
          rec.id = Number(rec.id); cl.ph[rec.id] = 1; PH.push(rec); changed = true;
          return dbTx("readwrite", function (st) { return st.put(rec); }).catch(function () {});
        }));
      });
      return Promise.all(jobs).then(function () { if (changed && (/^(gallery|album-)/.test(shown) || shown === "admin-photos")) clRefresh(); });
    }).catch(function () {}).then(function () { phBusy = false; });
  }

  go();
  if (shown === "") render("home");
  clConnect();
  dbAll().then(function (list) {
    PH = list || []; idbOk = true;
    if (/^(gallery|album-)/.test(shown) || (shown === "admin-photos" && !ui.newEv)) refresh();
  }).catch(function () { idbOk = false; });
})();
</script>
</body></html>
